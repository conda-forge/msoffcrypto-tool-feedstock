schema_version: 1

context:
  name: msoffcrypto-tool
  version: "6.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: e2d7dfca6ff69cf3da0a7225329e6c26febb4360f329db4937d6ee527fdd2569

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - msoffcrypto-tool = msoffcrypto.__main__:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - poetry
  run:
    - cryptography >=2.3
    - olefile >=0.45
    - python >=${{ python_min }},<4.0

tests:
  - python:
      imports:
        - msoffcrypto
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - msoffcrypto-tool --help

about:
  summary: Python tool and library for decrypting MS Office files with passwords or other keys
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/nolze/msoffcrypto-tool

extra:
  recipe-maintainers:
    - jan-janssen
